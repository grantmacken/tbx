name: tbx_build
on:
  push:
    branches:
      - tbx_conslolidate
  # Allow manual triggering
  workflow_dispatch:
jobs:
  # First branch build job
  build-tbx:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: false
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}
      - uses: actions/checkout@v4
      - name: buildah toolbox build
        run: make
